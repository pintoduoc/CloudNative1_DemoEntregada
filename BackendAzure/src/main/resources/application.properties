spring.application.name=BackendAzure
server.port=8080

#TENANT_ID:f3774aaa-430e-4736-a55c-3651f8257bfe
#API_CLIENT_ID:216311f5-c638-4ab5-8832-baae89eea5b5

# issuer-uri: Spring descarga automaticamente las llaves publicas de Entra ID
# desde <issuer-uri>/.well-known/openid-configuration y con ellas verifica la firma.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/f3774aaa-430e-4736-a55c-3651f8257bfe/v2.0

# audiences: el token debe venir dirigido a NUESTRA API.
# Sin esto, un token emitido para otra aplicacion del mismo tenant seria aceptado.
spring.security.oauth2.resourceserver.jwt.audiences=216311f5-c638-4ab5-8832-baae89eea5b5
